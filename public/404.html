<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nepres</title>
    <!--
      GitHub Pages has no server-side routing, so a direct visit or refresh on
      a sub-route (e.g. /Nepres/menu) 404s here. Redirect it back to
      index.html with the intended path encoded in the query string;
      index.html's inline script below restores it before React Router mounts.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
